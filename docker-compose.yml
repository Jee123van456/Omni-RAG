services:
  db:
    image: pgvector/pgvector:pg16
    container_name: omnirag-db
    restart: always
    environment:
      POSTGRES_DB: omnirag
      POSTGRES_USER: omnirag_user
      POSTGRES_PASSWORD: omnirag_password
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omnirag-redis
    restart: always
    ports:
      - "6375:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnirag-api
    restart: always
    command: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://omnirag_user:omnirag_password@db:5432/omnirag
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
      - HOST=0.0.0.0
      - ENV=development
      - OPENAI_API_KEY=mock-key
      - ANTHROPIC_API_KEY=mock-key
      - COHERE_API_KEY=mock-key
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnirag-worker
    restart: always
    command: celery -A workers.tasks:celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://omnirag_user:omnirag_password@db:5432/omnirag
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: omnirag-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  pgdata:
  redisdata:
